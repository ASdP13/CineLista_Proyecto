<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>CineLista - Añadir Título</title>
        <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../static/css/estilo.css">
    </head>
    <body class="container-fluid m-0 p-0 bg-background-cinelista">

        <header th:replace="~{fragments/nav :: header}"></header>

<!--
  TODO:
  El formulario de abajo tiene solo el campo "titulo" a proposito. Falta
  por vuestra parte anadir: genero, plataforma, estado y valoracion,
  colocando el boton de guardar al final, eligiendo el control html5 mas
  adecuado para cada campo (checkbox, radio, select, etc.) y maquetandolo
  con el editor visual + Bootstrap.

  El envio ya esta conectado: hace POST a /anadir-titulo y el controlador
  (PeliculaController) guarda la pelicula en el repositorio.
-->
        <main class="container-fluid p-5">
            <h1 class="text-center fw-bolder text-white mb-5">AÑADIR TÍTULO</h1>

            <form class="bg-container text-center text-white p-5" th:action="@{/anadir-titulo}" th:object="${pelicula}" method="post">
                <label class="text-start">Título*<br><input type="text" th:field="*{titulo}" required></label><br>
                <label class="text-start">Género*<br><input type="text" th:field="*{titulo}" required></label><br>
                <label class="text-start">Plataforma*<br><input type="text" th:field="*{titulo}" required></label><br>
                <label class="text-start">Estado*<br><input type="text" th:field="*{titulo}" required></label><br>
                <label class="text-start">Visualización<br><input type="text" th:field="*{titulo}" required></label><br>
                <button type="submit">Guardar</button>
            </form>
        </main>
    </body>
</html>
