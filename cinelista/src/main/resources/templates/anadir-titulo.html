<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>CineLista - Añadir Título</title>
        <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../static/css/estilo.css">
    </head>
    <body class="container-fluid m-0 p-0 bg-background-cinelista">
        <header th:replace="~{fragments/nav :: header}"></header>

<!--
  TODO:
  El formulario de abajo tiene solo el campo "titulo" a proposito. Falta
  por vuestra parte anadir: genero, plataforma, estado y valoracion,
  colocando el boton de guardar al final, eligiendo el control html5 mas
  adecuado para cada campo (checkbox, radio, select, etc.) y maquetandolo
  con el editor visual + Bootstrap.

  El envio ya esta conectado: hace POST a /anadir-titulo y el controlador
  (PeliculaController) guarda la pelicula en el repositorio.
-->

        <main class="container-fluid p-5 row">
            <h2 class="text-center text-bold fw-bolder text-white mb-5 fs-1">AÑADIR TÍTULO</h2>

            <form class="bg-container offset-4 col-4 text-center row text-white p-5 border-0 border rounded" th:action="@{/anadir-titulo}" th:object="${pelicula}" method="post">
                <div class="row">
                    <label class="text-start col-12 fs-4 mt-0 mb-2">Título*<br>
                        <input type="text" class="mt-0 mb-2 col-12 fs-5" th:field="*{titulo}" required>
                    </label><br>
                    <label class="text-start col-12 fs-4 mb-2">Género*<br>
                        <select class="mt-0 mb-2 col-12 fs-5" th:field="*{titulo}" required>
                            <option value="Fantasía">Fantasía</option>
                        </select>
                    </label><br>
                    <label class="text-start col-12 fs-4 mb-2">Plataforma*<br>
                        <select class="mt-0 mb-2 col-12 fs-5" th:field="*{titulo}" required>
                            <option value="Netflix">Netflix</option>
                        </select>
                    </label><br>
                    <label class="text-start col-12 fs-4 mb-2">Estado*<br>
                        <div class="d-flex justify-content-center">
                            <div class="me-5">
                                <input type="radio" class="radio-custom" id="visto" name="estado" value="visto">
                                <label for="visto">Visto</label>
                            </div>
                            <div class="ms-0">
                                <input type="radio" class="radio-custom" id="novisto" name="estado" value="novisto">
                                <label for="novisto">No visto</label>
                            </div>
                        </div>
                    </label><br>
                    <label class="text-start col-12 fs-4 mb-2">Valoración<br>
                        <div class="d-flex justify-content-between flex-row-reverse mt-2">
                            <button type="button" class="btn bg-primary-color rounded star-btn text-white"><i class="bi bi-star-fill"></i></button>
                            <button type="button" class="btn bg-primary-color rounded star-btn text-white"><i class="bi bi-star-fill"></i></button>
                            <button type="button" class="btn bg-primary-color rounded star-btn text-white"><i class="bi bi-star-fill"></i></button>
                            <button type="button" class="btn bg-primary-color rounded star-btn text-white"><i class="bi bi-star-fill"></i></button>
                            <button type="button" class="btn bg-primary-color rounded star-btn text-white"><i class="bi bi-star-fill"></i></button>
                        </div>
                    </label><br>

                    <input type="hidden" class="text-black" name="valoracion" id="rating-value" value="0">

                    <script>
                        document.addEventListener('DOMContentLoaded', () => {
                            const buttons = document.querySelectorAll('.star-btn');
                            const ratingInput = document.getElementById('rating-value');

                            buttons.forEach((button, index) => {
                                const starValue = 5 - index;
                                button.addEventListener('click', () => {
                                    // Guardamos el valor
                                    ratingInput.value = starValue;

                                    // Limpiamos la estrella activa anterior y marcamos la nueva
                                    buttons.forEach(btn => btn.classList.remove('active'));
                                    button.classList.add('active');
                                });
                            });
                        });
                    </script>
                </div>
                <div class="mt-5 px-4 row">
                    <button type="submit" class="btn bg-primary-color py-1 border-0 rounded text-white col-12 fw-bolder fs-5">Añadir título</button>
                </div>
            </form>
        </main>
    </body>
</html>
