<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>CineLista - Mi lista</title>
        <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../static/css/estilo.css">
    </head>
    <body class="container-fluid m-0 p-0 bg-background-cinelista">

        <header th:replace="~{fragments/nav :: header}"></header>

<!--
  TODO:
  La tabla de abajo esta reducida a una sola columna a proposito. Falta
  por vuestra parte:
   1) Disenar el prototipo con un editor visual (GrapesJS, Pinegrow, etc.)
   2) Anadir el resto de columnas: genero, plataforma, estado, valoracion
   3) Anadir un boton de borrar (decidid vosotros si va por fila o en comun,
      justificandolo)
   4) Maquetar con Bootstrap
   5) Comentar en el HTML generado donde dice "autogenerado"

  El modelo ya trae la lista de peliculas en la variable "peliculas"
  (Collection<Pelicula> con id y titulo). La ruta de borrado existe
  (POST /mi-lista/eliminar/{id}) pero el controlador (PeliculaController,
  metodo eliminar) esta a medias: teneis que completarlo vosotros.
-->
        <main class="container-fluid p-5">
            <h2 class="text-center text-bold fw-bolder text-white mb-5 fs-1">MI LISTA</h2>
            <table class="text-white text-center bg-container container-fluid">
                <thead>
                    <tr>
                        <th class="fs-4">Título</th>
                        <th class="fs-4 d-none d-md-table-cell">Género</th>
                        <th class="fs-4 d-none d-md-table-cell">Plataforma</th>
                        <th class="fs-4 d-none d-md-table-cell">Estado</th>
                        <th class="fs-4">Valoración</th>
                        <th class="fs-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${peliculas}">
                        <td class="fs-5" th:text="${p.titulo}">Título</td>
                        <td class="fs-5 d-none d-md-table-cell" th:text="${p.genero}">Género</td>
                        <td class="fs-5 d-none d-md-table-cell" th:text="${p.plataforma}">Plataforma</td>
                        <td class="fs-5 d-none d-md-table-cell" th:text="${p.estado}?'Visto':'No visto'">Estado</td>
                        <td class="fs-5 text-white d-flex justify-content-center">
                            <th:block th:if="${p.valoracion != null && p.valoracion > 0}">
                                <i th:each="i : ${#numbers.sequence(1, p.valoracion)}" class="bi bi-star-fill"></i>
                                <i th:if="${p.valoracion < 5}" th:each="i : ${#numbers.sequence(p.valoracion + 1, 5)}" class="bi bi-star text-secondary"></i>
                            </th:block>
                            <th:block th:if="${p.valoracion == null || p.valoracion == 0}">
                                <i th:each="i : ${#numbers.sequence(1, 5)}" class="bi bi-star text-secondary"></i>
                            </th:block>
                        </td>
                        <td class="fs-5">
                            <form th:action="@{/mi-lista/eliminar/{id}(id=${p.id})}" th:object="${p}" method="post">
                                <button type="submit" class="bg-primary-color text-white border-0 rounded-pill px-3 py-1">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p class="text-white fs-5" th:if="${#lists.isEmpty(peliculas)}">Todavía no hay películas registradas.</p>
        </main>
    </body>
</html>
