<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>CineLista - Estadísticas</title>
        <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
        <th:block th:replace="~{fragments/cabecera :: datatables}"></th:block>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../static/css/estilo.css">
    </head>
    <body class="container-fluid m-0 p-0 bg-background-cinelista">

    <header th:replace="~{fragments/nav :: header}"></header>

    <!--
      TODO:
      1) Comprobar jQuery y DataTables (CDN o local) ya agregadas
      2) Inicializad DataTables sobre la tabla de abajo con la opcion "ajax"
         apuntando a GET /api/estadisticas (endpoint que crearéis vosotros
         en el controlador EstadisticasController).
      3) Id completando: buscador, footerCallback con el total, columna con
         barra grafica, boton de exportar a CSV con nombre propio.
    -->

        <main class="container-fluid p-5 row">
            <h2 class="text-center text-bold fw-bolder text-white mb-5 fs-1">ESTADÍSTICAS</h2>
            <table id="tabla-estadisticas" class="tabla-cinelista text-white text-center">
                <thead class="tabla-cinelista-header text-center">
                <tr>
                    <th class="fs-4 text-third-color">Título</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Género</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Taquilla</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Nota</th>
                </tr>
                </thead>
                <tbody>
                <!-- Las filas las rellenara DataTables via ajax -->

                </tbody>
                <tfoot class="text-center">
                <tr>
                    <th class="text-center">Total</th>
                    <th></th>
                    <th id="total-taquilla" class="text-center"></th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
            <div class="text-center mt-4">
                <button id="cargar-mas" class="btn btn-primary">
                    Cargar más
                </button>
            </div>
        </main>
        <script>
            // 1. Función para limpiar de raíz las tildes de cualquier texto
            function quitarTildes(texto) {
                return !texto ? '' : texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            // 2. Registramos el limpiador en el motor interno de DataTables para las columnas
            jQuery.fn.DataTable.ext.type.search.string = function (data) {
                return quitarTildes(data);
            };

            $(document).ready(function () {
                const tabla = $('#tabla-estadisticas').DataTable({
                    ajax: {
                        url: '/api/estadisticas',
                        dataSrc: ''
                    },
                    columns: [
                        { data: 'titulo', type: 'string' },
                        { data: 'genero', type: 'string' },
                        {
                            data: 'taquilla',
                            render: function (data, type) {
                                if (type === 'display') {
                                    return Number(data).toLocaleString('es-ES') + ' €';
                                }
                                return data;
                            }
                        },
                        {
                            data: 'nota',
                            render: function (data, type, row) {
                                if (type !== 'display') return data;

                                // Calculamos el porcentaje sobre el máximo de la nota (que es 5)
                                const maxNota = 5;
                                const pct = Math.round((data / maxNota) * 100);

                                // Retornamos el HTML de la barra usando comillas invertidas para que renderice
                                return `<div class="progress bg-transparent border border-secondary" style="height: 24px; min-width: 100px;">
                                                    <div class="progress-bar bg-primary-color text-white fw-bold d-flex align-items-center justify-content-center"
                                                         role="progressbar"
                                                         style="width: ${pct}%;"
                                                         aria-valuenow="${data}"
                                                         aria-valuemin="0"
                                                         aria-valuemax="5">
                                                         ${data} / 5
                                                    </div>
                                                </div>`;
                            }
                        }
                    ],

                    pageLength: 3,
                    dom: 'ft',
                    paging: true,
                    lengthChange: false,
                    info: false,

                    language: {
                        search: '',
                    },

                    initComplete: function () {
                        const buscadorInput = $('#tabla-estadisticas_filter input');
                        buscadorInput.attr('placeholder', 'Buscar película');
                        const contenedorFiltro = $('#tabla-estadisticas_filter');
                        contenedorFiltro.html(buscadorInput);

                        buscadorInput.wrap('<div class="input-group"></div>');
                        buscadorInput.after('<span class="input-group-text bg-transparent border-0 text-secondary" id="buscador"><i class="bi bi-search"></i></span>');
                        buscadorInput.addClass('pe-5');

                        // Desvincula las funciones automáticas de DataTables
                        buscadorInput.off('keyup.DT search.DT input.DT');

                        // Filtro limpio insensible a las tildes
                        buscadorInput.on('keyup input', function () {
                            const textoLimpio = quitarTildes($(this).val());
                            tabla.search(textoLimpio).draw();
                        });
                    },

                    footerCallback: function () {
                        const api = this.api();
                        const total = api
                            .column(2, { search: 'applied' })
                            .data()
                            .reduce(function (suma, valor) {
                                return suma + Number(valor || 0);
                            }, 0);

                        $('#total-taquilla').html(
                            total.toLocaleString('es-ES') + ' €'
                        );
                    },

                    drawCallback: function () {
                        const api = this.api();
                        const mostradas = api.page.len();
                        const encontradas = api.rows({ search: 'applied' }).count();

                        $('#cargar-mas').toggle(mostradas < encontradas);
                    }
                });
                // Cargar 3 películas más cada vez que se pulse el botón
                $('#cargar-mas').on('click', function () {
                    tabla.page.len(tabla.page.len() + 3).draw();
                });
            });
        </script>
    </body>
</html>
