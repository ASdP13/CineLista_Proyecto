<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>CineLista - Estadísticas</title>
        <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
        <th:block th:replace="~{fragments/cabecera :: datatables}"></th:block>
        <th:block th:replace="~{fragments/cabecera :: datatables-buttons}"></th:block>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../static/css/estilo.css">
    </head>
    <body class="container-fluid m-0 p-0 bg-background-cinelista">

    <header th:replace="~{fragments/nav :: header}"></header>

    <!--
      TODO:
      1) Comprobar jQuery y DataTables (CDN o local) ya agregadas
      2) Inicializad DataTables sobre la tabla de abajo con la opcion "ajax"
         apuntando a GET /api/estadisticas (endpoint que crearéis vosotros
         en el controlador EstadisticasController).
      3) Id completando: buscador, footerCallback con el total, columna con
         barra grafica, boton de exportar a CSV con nombre propio.
    -->

        <main class="container-fluid p-5 row">
            <h2 class="text-center text-bold fw-bolder text-white mb-5 fs-1">ESTADÍSTICAS</h2>
            <table id="tabla-estadisticas" class="tabla-cinelista text-white text-center">
                <thead class="tabla-cinelista-header text-center">
                <tr>
                    <th class="fs-4 text-third-color">Título</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Género</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Taquilla</th>
                    <th class="fs-4 d-none d-lg-table-cell text-third-color">Nota</th>
                </tr>
                </thead>
                <tbody>
                <!-- Las filas las rellenara DataTables via ajax -->

                </tbody>
                <tfoot class="text-center">
                <tr>
                    <th class="text-center">Total</th>
                    <th></th>
                    <th id="total-taquilla" class="text-center"></th>
                    <th id="total-registros" class="text-end"></th>
                </tr>
                </tfoot>
            </table>
            <div class="text-center mt-4">
                <button id="cargar-mas" class="btn btn-primary">
                    Cargar más
                </button>
            </div>
        </main>
    <script>
        // Quita las tildes y convierte el texto a minúsculas
        function quitarTildes(texto) {
            return (texto || '').normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // Permite buscar palabras aunque tengan tildes
        jQuery.fn.DataTable.ext.type.search.string = quitarTildes;
        console.log('Versión DataTables:', $.fn.dataTable.version);
        console.log('Extensión Buttons:', $.fn.dataTable.Buttons);

        $(document).ready(function () {
            const tabla = $('#tabla-estadisticas').DataTable({
                // Carga las películas desde el controlador
                ajax: { url: '/api/estadisticas', dataSrc: '' },

                // Indica los datos que aparecen en cada columna
                columns: [
                    { data: 'titulo', type: 'string' },
                    { data: 'genero', type: 'string' },
                    {
                        data: 'taquilla',
                        // Muestra la taquilla con formato español y euros
                        render: (data, type) => type === 'display'
                            ? Number(data).toLocaleString('es-ES') + ' €'
                            : data
                    },
                    {
                        data: 'nota',
                        // Muestra la nota como una barra de progreso sobre 5
                        render: (data, type) => {
                            if (type !== 'display') return data;

                            const porcentaje = Math.round(data / 5 * 100);

                            return `
                                <div class="progress">
                                    <div class="progress-bar text-white fw-bold
                                                d-flex align-items-center justify-content-center"
                                         role="progressbar"
                                         style="width: ${porcentaje}%;"
                                         aria-valuenow="${data}"
                                         aria-valuemin="0"
                                         aria-valuemax="5">
                                        ${data} / 5
                                    </div>
                                </div>`;
                        }
                    }
                ],

                // Muestra 3 películas al principio y oculta opciones innecesarias
                pageLength: 3,
                dom: '<"estadisticas-controles"<"estadisticas-buscador"f><"estadisticas-exportar"B>>t',
                buttons: [
                    {
                        extend: 'csvHtml5',
                        text:  '<i class="bi bi-download me-1"></i> Exportar CSV',
                        className: 'btn-exportar-csv',
                        filename: 'estadisticas_cinelista',
                        fieldSeparator: ';',
                        bom: true
                    }
                ],
                lengthChange: false,
                info: false,
                language: { search: '' },

                // Configura el buscador con placeholder e icono de lupa
                initComplete: function () {
                    const buscador = $('#tabla-estadisticas_filter input')
                        .attr('placeholder', 'Buscar película')
                        .off('.DT');

                    const filtro = $('#tabla-estadisticas_filter');
                    filtro.html(buscador);
                    buscador.wrap('<div class="input-group"></div>');

                    buscador.after(`
                    <span id="buscador" class="input-group-text bg-transparent border-0">
                        <i class="bi bi-search"></i>
                    </span>
                `);

                    buscador.addClass('pe-5');

                    // Busca sin distinguir entre tildes y mayúsculas
                    buscador.on('input', function () {
                        tabla.search(quitarTildes(this.value)).draw();
                    });
                },

                // Suma la taquilla de las películas visibles en la tabla
                footerCallback: function () {
                    const total = this.api().column(2, { page: 'current' })
                        .data()
                        .reduce((suma, valor) => suma + Number(valor || 0), 0);

                    $('#total-taquilla').html(total.toLocaleString('es-ES') + ' €');
                },

                // Oculta el botón cuando ya se muestran todos los resultados
                drawCallback: function () {
                    const api = this.api();

                    // Número de películas mostradas y total de resultados
                    const mostradas = api.rows({ page: 'current' }).count();
                    const total = api.rows({ search: 'applied' }).count();

                    $('#total-registros').html(
                        `Mostrando ${mostradas} de ${total} películas`
                    );

                    // Oculta el botón cuando ya se muestran todos los resultados
                    $('#cargar-mas').toggle(
                        api.page.len() < total
                    );
                }
            });

            // Muestra 3 películas más cada vez que se pulsa el botón
            $('#cargar-mas').on('click', function () {
                tabla.page.len(tabla.page.len() + 3).draw();
            });
        });
    </script>
    </body>
</html>
